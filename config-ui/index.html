<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llama.cpp Settings</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel2: #f9fafb; --line: #e3e6eb; --line2: #eef0f3;
  --text: #1c2129; --muted: #69717d; --faint: #9aa1ab;
  --accent: #2f6fde; --accent-bg: #e8f0fd; --ok: #1f9d55; --ok-bg: #e5f5ec;
  --warn: #b7791f; --warn-bg: #fcf3e3; --err: #d64545; --err-bg: #fbeaea; --sleep: #7c6fd6;
  --radius: 8px; --shadow: 0 1px 2px rgba(20,25,35,.06), 0 4px 16px rgba(20,25,35,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14171c; --panel: #1b1f26; --panel2: #20252d; --line: #2c323c; --line2: #252a33;
    --text: #e3e6eb; --muted: #9aa2ad; --faint: #6b737e;
    --accent: #6ea0ff; --accent-bg: #22314d; --ok: #48c07a; --ok-bg: #1d3328;
    --warn: #e0a84e; --warn-bg: #3a2f1c; --err: #f07070; --err-bg: #3d2224; --sleep: #a69bff;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 "Segoe UI", "Malgun Gothic", system-ui, sans-serif; display: flex; flex-direction: column; }
[hidden] { display: none !important; }
code, pre, .mono { font-family: "Cascadia Mono", Consolas, "D2Coding", monospace; font-size: 12.5px; }
a { color: var(--accent); }
button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  padding: 5px 12px; cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { border-color: var(--faint); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.danger { color: var(--err); }
button.ghost { background: transparent; }
button.icon { padding: 2px 7px; font-size: 13px; line-height: 1.2; }
input[type=text], input[type=search], input[type=number], select {
  font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; min-width: 0; }
input:focus, select:focus { outline: 2px solid var(--accent-bg); border-color: var(--accent); }
input::placeholder { color: var(--faint); }

/* header */
.top { display: flex; align-items: center; gap: 14px; padding: 0 18px; height: 52px; background: var(--panel);
  border-bottom: 1px solid var(--line); flex: none; }
.brand { font-weight: 650; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.tabs { display: flex; gap: 2px; margin-left: 8px; }
.tabs button { border: none; background: none; padding: 6px 12px; color: var(--muted); border-radius: 6px; }
.tabs button.on { color: var(--text); background: var(--line2); font-weight: 600; }
.spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12.5px;
  background: var(--line2); color: var(--muted); white-space: nowrap; }
.pill.up { background: var(--ok-bg); color: var(--ok); }
.pill.down { background: var(--err-bg); color: var(--err); }
.vram { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.vram .bar { width: 120px; height: 7px; border-radius: 9px; background: var(--line2); overflow: hidden; }
.vram .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
.vram.hot .bar i { background: var(--err); }
.top a { text-decoration: none; font-size: 13px; white-space: nowrap; }
.top select { padding: 3px 6px; font-size: 12.5px; }

/* models layout */
.models { flex: 1; display: grid; grid-template-columns: 310px 1fr; min-height: 0; }
.list { border-right: 1px solid var(--line); overflow: auto; background: var(--panel2); padding: 10px 8px; }
.listhead { display: flex; justify-content: space-between; align-items: center; margin: 2px 8px 8px; }
.listhead h4 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; }
.listhead button { padding: 3px 10px; font-size: 12.5px; }
.mi { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: start; padding: 9px 10px; border-radius: var(--radius);
  cursor: pointer; border: 1px solid transparent; }
.mi:hover { background: var(--line2); }
.mi.on { background: var(--panel); border-color: var(--line); box-shadow: var(--shadow); }
.mi .mt { min-width: 0; }
.mi .mn { display: block; font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mi .mid { display: block; font-size: 11.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mi .mb { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; font-size: 11.5px; color: var(--muted); align-items: center; }
.mi .mb b, .badge { font-weight: 600; font-size: 10.5px; padding: 0 5px; border-radius: 4px; background: var(--line2); color: var(--muted); }
.mi .mb .dirty { background: var(--warn-bg); color: var(--warn); }
.mi .mb .cnt { background: var(--accent-bg); color: var(--accent); }
.mi button { padding: 2px 8px; font-size: 12px; }
.dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 5px; background: var(--faint); opacity: .5; }
.dot.s-loaded { background: var(--ok); opacity: 1; box-shadow: 0 0 0 3px var(--ok-bg); }
.dot.s-loading { background: var(--warn); opacity: 1; animation: pulse 1s infinite; }
.dot.s-sleeping { background: var(--sleep); opacity: .9; }
.dot.s-failed { background: var(--err); opacity: 1; }
@keyframes pulse { 50% { opacity: .3; } }

.detail { overflow: auto; min-width: 0; position: relative; }
.dwrap { max-width: 1080px; margin: 0 auto; padding: 18px 24px 90px; }
.dh { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.dh h2 { margin: 0 0 3px; font-size: 19px; letter-spacing: -.01em; }
.dmeta { color: var(--muted); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.dmeta code { color: var(--text); background: var(--line2); padding: 0 5px; border-radius: 4px; }
.dact { display: flex; gap: 8px; align-items: center; }
.st-label { font-size: 12.5px; padding: 3px 10px; border-radius: 99px; background: var(--line2); color: var(--muted); white-space: nowrap; }
.st-label.s-loaded { background: var(--ok-bg); color: var(--ok); }
.st-label.s-loading { background: var(--warn-bg); color: var(--warn); }
.st-label.s-sleeping { color: var(--sleep); }
.st-label.s-failed { background: var(--err-bg); color: var(--err); }
.notes { margin: 10px 0 0; padding: 8px 12px; background: var(--warn-bg); color: var(--warn); border-radius: var(--radius); font-size: 12.5px; }
.args { margin-top: 10px; font-size: 12.5px; }
.args summary { cursor: pointer; color: var(--muted); }
.args pre { white-space: pre-wrap; word-break: break-all; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px; margin: 6px 0 0; max-height: 220px; overflow: auto; }
.tools { display: flex; gap: 10px; align-items: center; margin: 16px 0 6px; flex-wrap: wrap; position: sticky; top: 0; z-index: 3;
  background: var(--bg); padding: 8px 0; }
.tools input[type=search] { flex: 1; min-width: 220px; padding: 7px 10px; }
.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; user-select: none; }

.group { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin: 12px 0; box-shadow: var(--shadow); }
.group > h3 { margin: 0; padding: 11px 16px 9px; font-size: 13.5px; border-bottom: 1px solid var(--line2); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.group > h3 small { font-weight: 400; color: var(--muted); font-size: 12px; }
.row { display: grid; grid-template-columns: minmax(230px, 1.15fr) minmax(210px, 1fr) 150px; gap: 14px; align-items: center;
  padding: 9px 16px; border-top: 1px solid var(--line2); }
.group > h3 + .row { border-top: none; }
.row .nm { font-weight: 600; }
.row .lt { display: flex; gap: 7px; align-items: baseline; flex-wrap: wrap; }
.row .lt code { color: var(--muted); font-size: 11.5px; }
.row .ds { color: var(--muted); font-size: 12px; margin-top: 1px; }
.row.plain .ds { font-size: 11.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row.plain:hover .ds { -webkit-line-clamp: unset; }
.row .ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 0; }
.row .ctl > input[type=text], .row .ctl > select { flex: 1; min-width: 120px; }
.row .ctl .err { flex-basis: 100%; color: var(--err); font-size: 11.5px; }
.row .ctl .err:empty { display: none; }
.row .st { display: flex; gap: 4px; align-items: center; justify-content: flex-end; }
.row.set { background: linear-gradient(90deg, var(--accent-bg), transparent 55%); }
.row.dirty { background: linear-gradient(90deg, var(--warn-bg), transparent 55%); }
.row.invalid input { border-color: var(--err); }
.row.disabled { opacity: .6; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--line2); color: var(--muted); white-space: nowrap; }
.tag.user { background: var(--accent-bg); color: var(--accent); font-weight: 600; }
.tag.dirty { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
.tag.removed { background: var(--err-bg); color: var(--err); }
.tag.src-auto { color: var(--ok); }
.dep { font-size: 10.5px; color: var(--warn); }
.ctxwrap { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 180px; }
.ctxwrap .ctxline { display: flex; gap: 8px; align-items: center; }
.ctxwrap input[type=range] { flex: 1; accent-color: var(--accent); }
.ctxwrap input[type=range].ghost { opacity: .45; }
.ctxwrap input[type=text] { width: 96px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chips button { padding: 0 7px; font-size: 11.5px; border-radius: 99px; }
details.all > summary { cursor: pointer; font-weight: 600; margin: 22px 0 4px; padding: 6px 0; list-style: none; display: flex; gap: 8px; align-items: center; }
details.all > summary::before { content: "▸"; color: var(--muted); transition: transform .15s; }
details.all[open] > summary::before { transform: rotate(90deg); }
details.all > summary small { color: var(--muted); font-weight: 400; }
.unknown { font-size: 12.5px; }
.empty { color: var(--muted); padding: 40px; text-align: center; line-height: 1.7; }
.empty button { margin-top: 12px; }

.savebar { position: sticky; bottom: 14px; z-index: 5; margin: 18px auto 0; max-width: 640px; display: flex; gap: 10px; align-items: center;
  background: var(--panel); border: 1px solid var(--warn); border-radius: 10px; padding: 9px 12px 9px 16px; box-shadow: var(--shadow); }
.savebar .sbt { flex: 1; font-weight: 600; }
.savebar .sbt small { font-weight: 400; color: var(--muted); margin-left: 6px; }

/* folders / router tabs */
.page { flex: 1; overflow: auto; }
.rwrap { max-width: 860px; margin: 0 auto; padding: 20px 24px 60px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); margin-bottom: 16px; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line2); flex-wrap: wrap; }
.card-h h3 { margin: 0; font-size: 14px; }
.card-b { padding: 12px 16px; }
.card .btns { display: flex; gap: 8px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 13px; }
.kv > div:nth-child(odd) { color: var(--muted); }
.kv pre { margin: 0; white-space: pre-wrap; word-break: break-all; }
.rform .row { grid-template-columns: minmax(230px, 1.2fr) minmax(160px, 1fr); }
.mismatch { margin-top: 10px; padding: 8px 12px; border-radius: var(--radius); background: var(--warn-bg); color: var(--warn); font-size: 12.5px; }
.muted { color: var(--muted); font-size: 12.5px; }
.frow { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line2); }
.frow .fp { font-family: "Cascadia Mono", Consolas, monospace; font-size: 12.5px; word-break: break-all; }
.frow .fs { font-size: 12px; color: var(--muted); margin-top: 2px; }
.frow .fs.bad { color: var(--err); }
.fadd { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line2); }
.fadd input { flex: 1; }

/* modal / toast */
.modal { position: fixed; inset: 0; background: rgba(10,12,16,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal .box { background: var(--panel); border-radius: 12px; max-width: 580px; width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.modal h3 { margin: 0; padding: 16px 18px 6px; font-size: 15px; }
.modal .mb2 { padding: 4px 18px 8px; max-height: 64vh; overflow: auto; font-size: 13.5px; }
.modal .mb2 ul { padding-left: 18px; margin: 6px 0; }
.modal .mb2 li { margin: 2px 0; word-break: break-all; }
.modal .mb2 .warnp { background: var(--warn-bg); color: var(--warn); padding: 8px 10px; border-radius: 6px; }
.modal .mb2 label { display: block; font-weight: 600; margin: 10px 0 4px; font-size: 13px; }
.modal .mb2 input[type=text] { width: 100%; }
.modal .mb2 .hint { color: var(--muted); font-size: 12.5px; margin-top: 10px; line-height: 1.6; }
.modal .mf { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 18px 16px; }
.spin { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
@keyframes rot { to { transform: rotate(360deg); } }
.toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: 460px; }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 9px 12px;
  box-shadow: var(--shadow); font-size: 13px; white-space: pre-wrap; word-break: break-word; }
.toast.ok { border-left-color: var(--ok); }
.toast.err { border-left-color: var(--err); }

@media (max-width: 900px) {
  .top { flex-wrap: wrap; height: auto; padding: 8px 12px; gap: 8px; }
  .models { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .list { max-height: 34vh; border-right: none; border-bottom: 1px solid var(--line); }
  .row, .rform .row { grid-template-columns: 1fr; gap: 6px; }
  .row .st { justify-content: flex-start; }
  .vram .bar { width: 60px; }
  .frow { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand" data-i18n="brand"></div>
  <nav class="tabs">
    <button data-tab="models" class="on" data-i18n="tab.models"></button>
    <button data-tab="folders" data-i18n="tab.folders"></button>
    <button data-tab="router" data-i18n="tab.router"></button>
  </nav>
  <div class="spacer"></div>
  <span id="routerPill" class="pill"></span>
  <div class="vram" id="vram"><div class="bar"><i></i></div><span>VRAM -</span></div>
  <a id="webuiLink" href="#" target="_blank" rel="noopener">WebUI ↗</a>
  <select id="langSel" title="Language"><option value="ko">한국어</option><option value="en">English</option></select>
</header>

<main class="models" id="tab-models">
  <aside class="list" id="modelList"></aside>
  <section class="detail" id="detail"></section>
</main>

<main class="page" id="tab-folders" hidden>
  <div class="rwrap">
    <section class="card">
      <div class="card-h"><h3 data-i18n="folders.title"></h3></div>
      <div class="card-b"><p class="muted" style="margin:0" data-i18n="folders.desc"></p></div>
      <div class="frow">
        <div><label class="chk" style="color:var(--text)"><input type="checkbox" id="fLm"> <b>LM Studio</b></label>
          <div class="fs" id="fLmStatus"></div></div>
        <span class="badge" id="fLmCount"></span><span></span>
      </div>
      <div id="fList"></div>
      <div class="fadd"><input type="text" id="fPath" spellcheck="false" data-i18n-ph="folders.addPh">
        <button class="primary" id="fAdd" data-i18n="folders.add"></button></div>
    </section>
    <section class="card">
      <div class="card-h"><h3 data-i18n="folders.manualTitle"></h3><button id="fAddModel" data-i18n="btn.addModel"></button></div>
      <div class="card-b"><p class="muted" style="margin:0" id="fManual"></p></div>
    </section>
  </div>
</main>

<main class="page" id="tab-router" hidden>
  <div class="rwrap">
    <section class="card">
      <div class="card-h"><h3 data-i18n="router.status"></h3>
        <div class="btns"><button id="rStart" data-i18n="router.start"></button><button id="rStop" class="danger" data-i18n="router.stop"></button><button id="rRestart" class="primary" data-i18n="router.restart"></button></div>
      </div>
      <div class="card-b" id="rInfo"></div>
    </section>
    <section class="card">
      <div class="card-h"><h3><span data-i18n="router.options"></span> <small class="muted">start-router.ps1</small></h3><button id="rSave" class="primary" data-i18n="router.save"></button></div>
      <div class="card-b"><p class="muted" style="margin:0 0 6px" data-i18n="router.optionsHint"></p></div>
      <div class="rform" id="rForm"></div>
    </section>
    <section class="card">
      <div class="card-h"><h3 data-i18n="files.title"></h3></div>
      <div class="card-b kv" id="rFiles"></div>
    </section>
  </div>
</main>

<div class="modal" id="modal" hidden><div class="box"><h3 id="mTitle"></h3><div class="mb2" id="mBody"></div><div class="mf" id="mFoot"></div></div></div>
<div class="toasts" id="toasts"></div>

<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ------------------------------------------------------------------ i18n
const I18N = {
  ko: {
    'brand': 'llama.cpp 설정',
    'tab.models': '모델', 'tab.folders': '폴더', 'tab.router': '라우터',

    'pill.loadedN': ' · {n}개 로드됨', 'pill.noneLoaded': ' · 로드된 모델 없음', 'pill.down': '라우터 꺼짐 :{port}',
    'pill.file': '파일로 열림 - 서버 주소로 여세요',

    'btn.addModel': '+ 모델 추가', 'btn.load': '로드', 'btn.unload': '언로드',
    'title.load': 'VRAM 에 올리기', 'title.unload': 'VRAM 에서 내리기',
    'badge.vision': '비전', 'badge.draft': '드래프터', 'badge.manual': '수동 추가', 'badge.folder': '폴더',
    'badge.overrides': '내 설정 {n}', 'badge.dirty': '저장 안 됨 {n}',
    'st.loaded': '로드됨', 'st.loading': '로딩 중', 'st.unloaded': '언로드됨', 'st.sleeping': '슬립 (VRAM 해제됨)',
    'st.downloading': '다운로드 중', 'st.downloaded': '다운로드됨', 'st.failed': '로드 실패', 'st.unknown': '알 수 없음', 'st.off': '라우터 꺼짐',
    'src.auto.lmstudio': 'LM Studio 자동', 'src.auto.folder': '자동 감지', 'src.global': '공통 [*]', 'src.default': 'llama.cpp 기본값',
    'detail.select': '모델을 선택하세요',
    'empty.noModels': '<b>아직 모델이 없어요.</b><br>GGUF 파일이나 모델 폴더를 추가하세요. LM Studio 가 있으면 그 모델도 자동으로 보여요.',
    'meta.trainCtx': '학습 컨텍스트 {n}', 'meta.mtp': 'MTP 내장', 'meta.vision': '비전', 'meta.draft': '드래프터 {name}',

async function api(path, body) {
  const init = { headers: { 'X-UI-Lang': LANG } };
  if (body !== undefined) Object.assign(init, { method: 'POST', body: JSON.stringify(body), headers: { 'X-UI-Lang': LANG, 'Content-Type': 'application/json' } });
  let r;
  try { r = await fetch(path, init); }
  catch (e) {
    throw new Error(location.protocol === 'file:' ? t('net.file', { url: SERVER_URL }) : t('net.down', { host: location.host, e: e.message }));
  }
  const d = await r.json().catch(() => ({ error: r.status + ' ' + r.statusText }));
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
}
function toast(msg, kind = '', ms = 4500) {
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;
  $('#toasts').append(el); setTimeout(() => el.remove(), ms);
}
function modal(title, html, buttons) {
  return new Promise(res => {
    $('#mTitle').textContent = title; $('#mBody').innerHTML = html; const f = $('#mFoot'); f.innerHTML = '';
    for (const [label, val, cls] of buttons) {
      const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls;
      b.onclick = () => { $('#modal').hidden = true; res(typeof val === 'function' ? val() : val); }; f.append(b);
    }
    $('#modal').hidden = false;
  });
}

}

      <div class="lt">${label ? `<span class="nm">${esc(label)}</span><code>--${esc(id)}</code>` : `<code class="nm">--${esc(id)}</code>`}
        ${o.deprecated ? `<span class="dep">${esc(t('row.deprecated'))}</span>` : ''}${o.reserved ? `<span class="dep">${esc(t('row.reserved'))}</span>` : ''}</div>
      <div class="ds">${esc(desc || o.help)}</div></div>
    <div class="ctl"></div><div class="st"></div>`;
  row.querySelector('.lab').title = (alias.length ? t('row.alias', { list: alias.join(', ') }) + '\n\n' : '') + o.help + (o.default ? '\n\n' + t('row.default', { v: o.default }) : '');
  const ctl = row.querySelector('.ctl');
  const locked = o.reserved || (id === 'model' && m.source !== 'manual');
  if (['bool', 'flag', 'enum'].includes(o.kind)) {
    const sel = document.createElement('select');
    sel.innerHTML = '<option value=""></option>' + (o.kind === 'enum'
      ? o.choices.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')
      : `<option value="true">${esc(t('row.on'))}</option><option value="false">${esc(t('row.off'))}</option>`);
    sel.onchange = () => setDraft(m, id, sel.value === '' ? null : sel.value);
    sel.disabled = locked; ctl.append(sel);
  } else {
    const inp = document.createElement('input'); inp.type = 'text'; inp.spellcheck = false; inp.disabled = locked;
    if (o.kind === 'number') inp.inputMode = 'decimal';
    const sugg = o.kind === 'list' ? o.choices : o.suggest;
    if (sugg?.length) {
      const dl = document.createElement('datalist'); dl.id = 'dl-' + id;
      dl.innerHTML = sugg.map(s => `<option value="${esc(s)}">`).join(''); ctl.append(dl); inp.setAttribute('list', dl.id);
    }
    inp.oninput = () => setDraft(m, id, inp.value.trim() === '' ? null : inp.value.trim(), true);
    if (id === 'ctx-size') {
      const max = m.ctx_train || 262144;
      const wrap = document.createElement('div'); wrap.className = 'ctxwrap';
      wrap.innerHTML = `<div class="ctxline"><input type="range" min="0" max="${max}" step="1024"></div><div class="chips"></div>`;
      const rng = wrap.querySelector('input'); wrap.querySelector('.ctxline').append(inp);
      rng.oninput = () => { inp.value = rng.value; setDraft(m, id, rng.value, true); };
      const chips = wrap.querySelector('.chips');
      for (const [v, l] of [[8192, '8K'], [16384, '16K'], [32768, '32K'], [65536, '64K'], [131072, '128K'], [262144, '256K']]) {
        if (v > max) continue;
        const b = document.createElement('button'); b.textContent = l; b.type = 'button';
        b.onclick = () => { inp.value = v; rng.value = v; setDraft(m, id, String(v), true); }; chips.append(b);
      }
      ctl.append(wrap);
    } else ctl.append(inp);
  }
  const err = document.createElement('div'); err.className = 'err'; ctl.append(err);
  if (locked) row.classList.add('disabled');
  refreshRow(row, m);
  return row;
}

function refreshRow(row, m, fromInput) {
  const id = row.dataset.id, o = OPT[id];
  const v = curVal(m, id);
  const removed = v === '!';
  const inh = inherited(m, id, removed);
  const inhTxt = fmtVal(o, inh.v) || t('val.none');
  const sel = row.querySelector('.ctl select');
  const inp = row.querySelector('.ctl input[type=text]');
  const rng = row.querySelector('.ctl input[type=range]');
  if (sel) {
    sel.options[0].textContent = t('row.inherit', { v: inhTxt });
    let sv = v === null || removed ? '' : v;
    if (sv && (o.kind === 'bool' || o.kind === 'flag')) sv = TRUTHY.includes(sv.toLowerCase()) ? 'true' : 'false';
    sel.value = sv;
  }
  if (inp) {
    if (!fromInput) inp.value = v === null || removed ? '' : v;
    inp.placeholder = inhTxt;
    if (rng) {
      const eff = inp.value || (/^\d+$/.test(inh.v) ? inh.v : '0');
      if (document.activeElement !== rng) rng.value = eff;
      rng.classList.toggle('ghost', !inp.value);
    }
  }
  const dirty = !!DRAFT[m.id]?.has(id);
  const st = row.querySelector('.st'); st.innerHTML = '';
  let tag;
  if (dirty) tag = `<span class="tag dirty" title="${esc(t('tag.unsaved'))}">${esc(t(removed ? 'tag.willRemove' : v === null ? 'tag.willClear' : 'tag.changed'))}</span>`;
  else if (removed) tag = `<span class="tag removed" title="${esc(t('tag.removedTitle'))}">${esc(t('tag.removed'))}</span>`;
  else if (v !== null) tag = `<span class="tag user">${esc(t('tag.user'))}</span>`;
  else tag = `<span class="tag src-${inh.src}">${esc(srcLabel(m, inh.src))}</span>`;
  st.insertAdjacentHTML('beforeend', tag);
  const locked = o.reserved || (id === 'model');
  if (!locked && v !== null) {
    const b = document.createElement('button'); b.className = 'icon ghost'; b.textContent = '↺';
    b.title = t(removed ? 'btn.restoreAuto' : 'btn.clear');
    b.onclick = () => setDraft(m, id, null); st.append(b);
  } else if (!locked && v === null && m.auto[id] && m.source !== 'manual') {
    const b = document.createElement('button'); b.className = 'icon ghost'; b.textContent = '✕';
    b.title = t('btn.removeAuto', { v: m.auto[id].value });
    b.onclick = () => setDraft(m, id, '!'); st.append(b);
  }
  const e = validate(o, v);
  row.classList.toggle('invalid', !!e);
  row.querySelector('.ctl .err').textContent = e;
  row.classList.toggle('set', v !== null && !dirty);
  row.classList.toggle('dirty', dirty);
}

function applyFilter() {

async function save() {
  const m = model(CUR); const d = DRAFT[m?.id];

  const st = statusOf(m.id);

function renderRouterStatus() {

  if (!RINFO) { el.textContent = t('router.checking'); return; }

function renderRouterForm() {

async function routerAction(act) {
  const ld = loadedList();
  if (act !== 'start') {
    const html = (ld.length ? `<p class="warnp">${t('confirm.loaded', { list: esc(ld.join(', ')) })}</p>` : '')
      + `<p class="muted">${esc(t(act === 'restart' ? 'confirm.restartNote' : 'confirm.stopNote'))}</p>`;
    if (!await confirmBox(t(act === 'restart' ? 'confirm.restartTitle' : 'confirm.stopTitle'), html,
      t(act === 'restart' ? 'router.restart' : 'router.stop'), act === 'restart' ? 'primary' : 'danger')) return;
  }
  busy(t('busy.' + act));
  try {
    await api('/api/router/' + act, {});
    busy(false);
    if (act === 'stop') toast(t('toast.stopped'), 'ok');
    else { toast(t('toast.started'), 'ok', 6000); waitRouterUp(); }
  } catch (e) { busy(false); toast(e.message, 'err', 9000); }

async function waitRouterUp() {

    await new Promise(r => setTimeout(r, 2000));
    await pollLive();

  }
  toast(t('toast.timeout'), 'err', 10000);
}

  S = await api('/api/state');
  OPT = {}; ALIAS = {};
  for (const o of S.options) { OPT[o.id] = o; for (const n of [...o.names, ...o.neg]) ALIAS[n] ??= o.id; }
  if (!CUR || !model(CUR)) CUR = S.models[0]?.id;
  rerender(keep);
}
$('#langSel').onchange = () => {
  LANG = $('#langSel').value;
  try { localStorage.setItem('llamaConfigUi.lang', LANG); } catch {}
  applyStatic();
  if (S) rerender(true);
  renderLive();
  if (TAB === 'router') renderRouterStatus();
};

(async () => {
  applyStatic();
  if (location.protocol === 'file:') {
    $('#detail').innerHTML = `<div class="empty">${t('file.guard', { url: SERVER_URL })}</div>`;
    $('#routerPill').className = 'pill down'; $('#routerPill').textContent = t('pill.file');
    return;
  }
  $('#routerPill').textContent = t('pill.checking');
  $('#modelList').innerHTML = `<div class="empty">${esc(t('list.loading'))}</div>`;
  pollLive();
  try { await loadState(); }
  catch (e) { $('#detail').innerHTML = `<div class="empty">${esc(t('load.failed', { e: e.message }))}</div>`; }
  setInterval(pollLive, 2500);
})();
</script>
</body>
</html>
